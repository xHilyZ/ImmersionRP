<!DOCTYPE html>
<html>
<head>
  <title>Immersion Roleplay — Spin Wheel</title>
  <link rel="stylesheet" href="/styles/spin.css">
</head>

<body>

<div class="spin-wrapper">

  <h1 class="title">Daily Spin Wheel</h1>
  <p class="subtitle">Try your luck and win exclusive rewards</p>

  <div class="wheel-container">
    <canvas id="wheelCanvas" width="420" height="420"></canvas>
    <button id="spinBtn" class="spin-btn">SPIN</button>
  </div>

  <div id="resultPopup" class="popup hidden">
    <div class="popup-content">
      <h2>You Won!</h2>
      <p id="rewardText"></p>
      <button onclick="closePopup()" class="close-btn">Close</button>
    </div>
  </div>

  <canvas id="fireworksCanvas" class="fireworks"></canvas>

</div>

<script src="/scripts/spin.js"></script>

</body>
</html>
