<!DOCTYPE html>
<html>
<head>
  <title>Immersion Roleplay — Case Spin</title>
  <link rel="stylesheet" href="/styles/spin.css">
</head>

<body>

<div class="spin-wrapper">

  <h1 class="title">Daily Case Spin</h1>
  <p class="subtitle">Try your luck and win exclusive rewards</p>

  <div class="case-layout">

    <div class="case-container">
      <div class="case-window">
        <div class="case-items" id="caseItems"></div>
        <div class="case-marker"></div>
      </div>
      <button id="spinBtn" class="spin-btn">SPIN</button>
    </div>

    <div class="reward-list">
      <h3>Possible Rewards</h3>
      <ul>
        <li>🎁 Mystery Box</li>
        <li>💎 Rare Item</li>
        <li>✨ Exclusive Cosmetic</li>
        <li>💵 $5,000 Cash</li>
        <li>💰 $10,000 Cash</li>
        <li>🥉 Free Bronze Pass</li>
        <li>🔫 Weapon Crate</li>
        <li>⚡ Priority Queue Token</li>
      </ul>
    </div>

  </div>

  <div id="resultPopup" class="popup hidden">
    <div class="popup-content">
      <h2>You Won!</h2>
      <p id="rewardText"></p>
      <button onclick="closePopup()" class="close-btn">Close</button>
    </div>
  </div>

</div>

<script src="/scripts/spin.js"></script>

</body>
</html>
